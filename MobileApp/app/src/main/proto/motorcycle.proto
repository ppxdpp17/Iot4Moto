syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.iot";
option java_outer_classname = "MotorcycleProto";

package motorcycle;

service MotorcycleService {
    rpc SendCommand (CommandRequest) returns (CommandReply);
}

message CommandRequest {
    string vin = 1;
    string action = 2;
}

message CommandReply {
    bool success = 1;
    string message = 2;
}