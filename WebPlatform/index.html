<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <title>Dashboard Moto IoT - Telemetria</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; text-align: center; }
        .container { margin-top: 50px; }
        #bike-container {
            width: 320px; height: 320px; margin: 0 auto;
            border: 4px solid #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #222 0%, #121212 100%);
            box-shadow: 0 0 20px rgba(0,255,0,0.1);
        }
        #bike-img {
            width: 220px;
            /* Se a imagem falhar, isto ajuda a ver que algo está a rodar */
            transition: transform 0.05s linear; 
        }
        .data-box { font-size: 28px; margin-top: 25px; color: #00ff00; font-weight: bold; }
        #log { font-size: 12px; color: #888; margin-top: 20px; font-family: monospace; }
        .alert { color: #ff4444; }
    </style>

</head>
<body>

    <h1>Motorcycle Intelligent System</h1>

    <div style="margin-bottom: 20px;">
        <button onclick="setMode('live')" style="padding: 10px; background: #00ff00; color: #000; font-weight: bold; border: none; cursor: pointer;">Em Tempo Real</button>
        <button onclick="setMode('history')" style="padding: 10px; background: #444; color: #fff; font-weight: bold; border: none; cursor: pointer;">Rotas Passadas</button>
    </div>

    <div id="history-controls" style="display: none; margin-bottom: 20px; background: #222; padding: 20px; border-radius: 10px; width: 80%; margin: 0 auto;">
        <select id="route-select" onchange="loadRoute()" style="padding: 10px; font-size: 16px; width: 100%; max-width: 400px;"></select>
        <div id="route-stats" style="margin-top: 15px; color: #00ff00; font-size: 18px;"></div>
        <video id="route-video" width="100%" max-width="600" controls style="margin-top: 20px; border: 2px solid #555; border-radius: 8px;"></video>
    </div>

    <div class="container">
        <div id="bike-container">
            <img id="bike-img" src="/WebPlatform/img/mota.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3721/3721619.png'" alt="Moto">
        </div>
        
        <div class="data-box">
            Roll: <span id="roll-val">0.00</span>°
            Motor: <span id="moto-state" style="color: #ff4444;">OFF</span>
        </div>
        <div id="status">A ligar ao Broker...</div>
        <div id="log"></div>
    </div>

    <div id="map" style="width: 100%; max-width: 600px; height: 500px; margin: 40px auto; border-radius: 12px; border: 2px solid #333; box-shadow: 0 0 20px rgba(0,255,0,0.1);"></div>

    <script>
        const BROKER_IP = "172.20.0.203"; 
        const PORT = 9001;
        const CLIENT_ID = "Web_Dash_" + Math.random().toString(16).substr(2, 5);


        let map = L.map('map').setView([0, 0], 15); // Inicializa a 0,0
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        let marker = L.marker([0, 0]).addTo(map);
        let currentLat = null;
        let currentLon = null;

        function addLog(msg, isError = false) {
            const logDiv = document.getElementById("log");
            logDiv.innerHTML = `<span class="${isError ? 'alert' : ''}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>` + logDiv.innerHTML;
        }

        function updateMap() {
            if (currentLat !== null && currentLon !== null) {
                let newLatLng = new L.LatLng(currentLat, currentLon);
                marker.setLatLng(newLatLng);
                map.panTo(newLatLng);
            }
        }

        const client = new Paho.MQTT.Client(BROKER_IP, PORT, CLIENT_ID);

        client.onConnectionLost = (responseObject) => {
            document.getElementById("status").innerText = "❌ Ligação Perdida";
            addLog(responseObject.errorMessage, true);
        };

        client.onMessageArrived = (message) => {
            if (currentMode === 'history') return;
            if (message.destinationName === "moto/roll") {
                let angle = parseFloat(message.payloadString);
                document.getElementById("roll-val").innerText = angle.toFixed(2);
                document.getElementById("bike-img").style.transform = `rotate(${angle}deg)`;
            }
            else if (message.destinationName === "sim/motorcycle") {
                const stateSpan = document.getElementById("moto-state");
                if (message.payloadString === "on") {
                    stateSpan.innerText = "ON";
                    stateSpan.style.color = "#00ff00"; //Verde
                } else {
                    stateSpan.innerText = "OFF";
                    stateSpan.style.color = "#ff4444"; //Vermelho
                }
            }
            else if (message.destinationName === "moto/gps/latitude") {
                currentLat = parseFloat(message.payloadString);
                updateMap();
            }
            else if (message.destinationName === "moto/gps/longitude") {
                currentLon = parseFloat(message.payloadString);
                updateMap();
            }
        };

        const connectOptions = {
            onSuccess: () => {
                document.getElementById("status").innerText = "✅ Ligado via WebSocket";
                document.getElementById("status").style.color = "#00ff00";
                addLog("Subscrito ao tópico moto/roll");
                client.subscribe("moto/roll");
                client.subscribe("sim/motorcycle");
                client.subscribe("moto/gps/latitude");
                client.subscribe("moto/gps/longitude");
            },
            onFailure: (err) => {
                document.getElementById("status").innerText = "❌ Falha na Ligação";
                addLog("Erro: " + err.errorMessage, true);
            },
            useSSL: false,
            timeout: 3
        };

            let currentMode = 'live';
        let routeData = [];

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('history-controls').style.display = mode === 'history' ? 'block' : 'none';
            if (mode === 'history') fetchRoutes();
        }

        async function fetchRoutes() {
            try {
                // Lê o catálogo gerado pelo Python
                const res = await fetch('./data/index.json');
                const routes = await res.json();
                const select = document.getElementById('route-select');
                select.innerHTML = '<option value="">Selecione uma rota...</option>';
                window.routesCatalog = routes; 
                
                routes.forEach(r => {
                    select.innerHTML += `<option value="${r.id}">${r.name}</option>`;
                });
            } catch (e) {
                addLog("Erro ao carregar histórico. A pasta processed_routes está na raiz do HTML?", true);
            }
        }

        async function loadRoute() {
            const id = document.getElementById('route-select').value;
            if(!id) return;
            const route = window.routesCatalog.find(r => r.id === id);

            // Estatísticas sem a feature das curvas
            document.getElementById('route-stats').innerHTML = 
                `Início: ${route.start_time} | Duração: ${route.duration_sec}s <br> Distância: ${route.distance_km} km`;

            // Lida com a presença ou ausência de vídeo
            const videoElement = document.getElementById('route-video');
            if (route.video_file) {
                const videoName = route.video_file.split('/').pop();
                videoElement.src = `./videos/${videoName}`; // Aponta para a pasta videos/
                videoElement.style.display = 'block';
            } else {
                videoElement.src = "";
                videoElement.style.display = 'none';
            }

            // Carrega o JSON da pasta 'data'
            const res = await fetch(`./data/${route.data_file}`);
            routeData = await res.json();
        }

        // O coração da sincronização
        document.getElementById('route-video').addEventListener('timeupdate', (e) => {
            if(currentMode !== 'history' || routeData.length === 0) return;

            // Converter o tempo do vídeo para milissegundos
            const currentTimeMs = Math.floor(e.target.currentTime * 10) * 100;

            // Procurar a frame de dados exata (ou a mais próxima)
            const frame = routeData.find(d => d.t >= currentTimeMs);
            
            if(frame) {
                // Atualiza Mota
                document.getElementById("roll-val").innerText = frame.r.toFixed(2);
                document.getElementById("bike-img").style.transform = `rotate(${frame.r}deg)`;

                // Atualiza Mapa
                if(frame.la && frame.lo) {
                    currentLat = frame.la;
                    currentLon = frame.lo;
                    updateMap();
                }
            }
        });

        try {
            client.connect(connectOptions);
        } catch (e) {
            addLog(e.message, true);
        }
    </script>
</body>
</html>
