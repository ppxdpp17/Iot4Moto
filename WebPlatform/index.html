<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Web Platform MotoIOT</title>
    <link rel="icon" type="image/x-icon" href="/WebPlatform/img/icon.png">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-motorcycle"></i></div>
        <button class="nav-btn active" id="btn-live" onclick="switchMode('live')" title="Tempo Real">
            <i class="fa-solid fa-satellite-dish"></i>
        </button>
        <button class="nav-btn" id="btn-history" onclick="switchMode('history')" title="Rotas Passadas">
            <i class="fa-solid fa-folder-open"></i>
        </button>
    </div>

    <div class="panel-center">
        <div class="header-status">
            <div>
                <span style="font-size: 12px; color: var(--text-muted);">Estado do Sistema</span>
                <div id="conn-status" style="font-size: 14px; color: var(--warning);">A aguardar...</div>
            </div>
            <div id="moto-state" class="state-badge">ON</div>
        </div>

        <div class="telemetry-cards">
            <div class="t-card">
                <i class="fa-solid fa-gauge-high"></i>
                <div class="t-value" id="vel-val">0</div>
                <div class="t-label">km/h</div>
            </div>
            <div class="t-card">
                <i class="fa-solid fa-battery-three-quarters"></i>
                <div class="t-value" id="bat-val">--</div>
                <div class="t-label">% Bateria</div>
            </div>
        </div>

        <div class="imu-module">
            <div id="bike-container">
                <img id="bike-img" src="/WebPlatform/img/mota.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3721/3721619.png'" alt="Moto">
            </div>
            <div class="roll-display"><span id="roll-val">0.00</span>°</div>
            <div style="color: var(--text-muted); font-size: 12px; margin-top: 5px;">Ângulo de Inclinação (Roll)</div>
            &nbsp;&nbsp;
            <div class="sensor-card fcw-card">
                <h4>Radar Frontal</h4>
                <div class="radar-container">
                    <img src="/WebPlatform/img/motaTOP.png" alt="Mota_TopView" class="radar-moto">
                    <div id="radar-obstacle"></div>
                </div>
                <div class="radar-stats">
                    <span>Distância: <span id="fcw-dist">--</span> m</span>
                    <span class="ttc-highlight">TTC: <span id="fcw-ttc">--</span> s</span>
                </div>
            </div>
            &nbsp;&nbsp;
            <div class="sensor-card rain-card">
                <svg id="rain-icon" class="inactive" viewBox="0 0 24 24" width="40" height="40">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
            </div>
        </div>

        <div class="alerts-module">
            <h3 id="alerts-title">Eventos Recentes</h3>
            <div id="alerts-wrapper">
                <ul id="alerts-list"></ul>
                <div id="history-msg"><i class="fa-solid fa-clock-rotate-left" style="font-size:24px; margin-bottom:10px; display:block;"></i>Eventos ao vivo ocultos no modo histórico.</div>
            </div>
        </div>
    </div>

    <div class="panel-right">
        <div id="map"></div>

        <div class="top-right-panel">
            <div id="live-cam-wrapper">
                <div id="live-cam-placeholder">
                    <i class="fa-solid fa-video-slash" style="font-size: 24px; margin-bottom: 10px;"></i>
                    <span style="font-size: 12px;">Câmara Offline</span>
                </div>
                
                <img id="live-cam-stream" src="http://172.20.0.154:5000/stream" 
                     style="width: 100%; height: 180px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: none;" 
                     onload="this.style.display='block'; document.getElementById('live-cam-placeholder').style.display='none';"
                     onerror="this.style.display='none'; document.getElementById('live-cam-placeholder').style.display='flex';">
            </div>
            
            <div id="history-controls">
                <select id="route-select" onchange="loadRoute()">
                    <option value="">A carregar rotas...</option>
                </select>
                <div id="route-stats"></div>
                <video id="route-video" controls></video>
                <div id="virtual-player" style="display: none; background: var(--bg-panel); padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border);">
                    <div style="margin-bottom: 10px; color: var(--text-muted); font-size: 13px; text-align: center;">
                        Apenas Dados de Telemetria
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button id="virtual-play-btn" onclick="toggleVirtualPlay()" style="background: var(--primary); color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <input type="range" id="virtual-slider" value="0" min="0" max="100" step="0.1" style="flex-grow: 1; accent-color: var(--primary);" oninput="seekVirtual()">
                    </div>
                    <div id="virtual-time-display" style="font-size: 12px; margin-top: 8px; color: var(--text-muted); text-align: center;">00:00 / 00:00</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
