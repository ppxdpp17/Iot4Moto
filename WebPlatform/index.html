<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Moto IoT - Telemetria</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-panel: #1a1d24;
            --primary: #00ff88;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --danger: #ff4757;
            --warning: #ffa502;
            --border: #2d323e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /*SCROLLBAR*/
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a4150; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden;
            display: grid;
            grid-template-columns: 80px 350px 1fr; 
        }

        /* SIDEBAR */
        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding-top: 20px;
        }
        .logo { font-size: 32px; color: var(--primary); margin-bottom: 50px; }
        
        .nav-btn {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 24px; margin-bottom: 30px; cursor: pointer; transition: 0.3s; position: relative;
        }
        .nav-btn:hover, .nav-btn.active { color: var(--primary); }
        .nav-btn.active::after {
            content: ''; position: absolute; right: -28px; top: 0;
            height: 100%; width: 4px; background: var(--primary); border-radius: 4px;
        }

        /* COLUNA CENTRAL */
        .panel-center {
            padding: 20px; display: flex; flex-direction: column; gap: 20px;
            border-right: 1px solid var(--border); overflow-y: auto;
        }
        
        .header-status {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-panel); padding: 15px; border-radius: 12px;
        }
        .state-badge {
            background: rgba(255, 68, 68, 0.2); color: var(--danger);
            padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px;
        }
        .state-badge.on { background: rgba(0, 255, 136, 0.2); color: var(--primary); }

        .telemetry-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .t-card { background: var(--bg-panel); padding: 15px; border-radius: 12px; text-align: center; }
        .t-card i { color: var(--text-muted); font-size: 18px; margin-bottom: 5px; }
        .t-value { font-size: 24px; font-weight: bold; color: var(--primary); }
        .t-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }

        .imu-module {
            background: var(--bg-panel); border-radius: 12px; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        #bike-container {
            width: 200px; height: 200px; position: relative;
            border: 2px dashed var(--border); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin-bottom: 15px;
        }
        #bike-img { width: 140px; transition: transform 0.1s linear; }
        .roll-display { font-size: 28px; font-weight: bold; font-family: monospace; }
        
        .alerts-module { 
            flex-grow: 1; background: var(--bg-panel); border-radius: 12px; 
            padding: 15px; display: flex; flex-direction: column; overflow: hidden;
        }
        .alerts-module h3 { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase;}
        
        #alerts-wrapper { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
        #alerts-list { list-style: none; }
        .alert-item {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px;
        }
        .alert-item i { font-size: 16px; margin-top: 2px; }
        .alert-item .time { color: var(--text-muted); font-size: 11px; display: block; margin-top: 3px;}
        
        /* Mensagem quando em modo histórico */
        #history-msg { display: none; color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 20px; }

        .alert-danger { color: var(--danger); }
        .alert-warning { color: var(--warning); }
        .alert-info { color: var(--primary); }

        /* COLUNA DIREITA (Mapa + Câmaras flutuantes) */
        .panel-right { position: relative; background: #000; }
        #map { width: 100%; height: 100%; z-index: 1; }
        
        /* CAIXA FLUTUANTE TOP RIGHT (Câmara/Vídeo) */
        .top-right-panel {
            position: absolute; top: 20px; right: 20px; width: 340px;
            background: rgba(26, 29, 36, 0.95); backdrop-filter: blur(5px);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 15px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Elementos dentro do painel flutuante */
        #live-cam-placeholder {
            height: 180px; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; color: var(--text-muted); border: 2px dashed var(--border); border-radius: 8px;
        }
        
        #history-controls { display: none; flex-direction: column; gap: 10px; }
        #history-controls select {
            padding: 10px; background: var(--bg-dark); color: white; border: 1px solid var(--border);
            border-radius: 6px; font-size: 14px; width: 100%; outline: none;
        }
        #route-stats { font-size: 12px; color: var(--primary); text-align: center; }
        #route-video { width: 100%; border-radius: 8px; background: #000; margin-top: 10px; }

        .leaflet-marker-icon {
            transition: transform 1s linear !important;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-motorcycle"></i></div>
        <button class="nav-btn active" id="btn-live" onclick="switchMode('live')" title="Tempo Real">
            <i class="fa-solid fa-satellite-dish"></i>
        </button>
        <button class="nav-btn" id="btn-history" onclick="switchMode('history')" title="Rotas Passadas">
            <i class="fa-solid fa-folder-open"></i>
        </button>
    </div>

    <div class="panel-center">
        <div class="header-status">
            <div>
                <span style="font-size: 12px; color: var(--text-muted);">Estado do Sistema</span>
                <div id="conn-status" style="font-size: 14px; color: var(--warning);">A aguardar...</div>
            </div>
            <div id="moto-state" class="state-badge">OFF</div>
        </div>

        <div class="telemetry-cards">
            <div class="t-card">
                <i class="fa-solid fa-gauge-high"></i>
                <div class="t-value" id="vel-val">0</div>
                <div class="t-label">km/h</div>
            </div>
            <div class="t-card">
                <i class="fa-solid fa-battery-three-quarters"></i>
                <div class="t-value" id="bat-val">--</div>
                <div class="t-label">% Bateria</div>
            </div>
        </div>

        <div class="imu-module">
            <div id="bike-container">
                <img id="bike-img" src="/WebPlatform/img/mota.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3721/3721619.png'" alt="Moto">
            </div>
            <div class="roll-display"><span id="roll-val">0.00</span>°</div>
            <div style="color: var(--text-muted); font-size: 12px; margin-top: 5px;">Ângulo de Inclinação (Roll)</div>
        </div>

        <div class="alerts-module">
            <h3 id="alerts-title">Eventos Recentes</h3>
            <div id="alerts-wrapper">
                <ul id="alerts-list"></ul>
                <div id="history-msg"><i class="fa-solid fa-clock-rotate-left" style="font-size:24px; margin-bottom:10px; display:block;"></i>Eventos ao vivo ocultos no modo histórico.</div>
            </div>
        </div>
    </div>

    <div class="panel-right">
        <div id="map"></div>

        <div class="top-right-panel">
            
            <img id="live-cam-stream" src="http://172.20.0.154:5000/stream" style="width: 100%; height: 180px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border);" alt="Câmara Offline">

            <div id="history-controls">
                <select id="route-select" onchange="loadRoute()">
                    <option value="">A carregar rotas...</option>
                </select>
                <div id="route-stats"></div>
                <video id="route-video" controls></video>
            </div>

        </div>
    </div>

    <script>
        const BROKER_IP = "172.20.0.203"; 
        const PORT = 9001;
        const CLIENT_ID = "Web_Dash_" + Math.random().toString(16).substr(2, 5);

        let currentMode = 'live';
        let routeData = [];
        let currentLat = null;
        let currentLon = null;

        let lastLat = null;
        let lastLon = null;

        //Icon da mota
        const motoIcon = L.divIcon({
            html: `<img id="moto-marker-icon" src="https://cdn-icons-png.flaticon.com/128/11432/11432322.png" style="width: 32px; height: 32px; transition: transform 1s linear; transform: rotate(180deg);">`,
            className: 'custom-moto-icon',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });



        // Memória do estado LIVE para restaurar quando voltamos do histórico
        let liveState = {
            roll: 0, vel: 0, bat: '--', lat: null, lon: null
        };

        // INICIALIZAR MAPA
        let map = L.map('map', { zoomControl: false }).setView([41.3, -7.74], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, theme: 'dark' }).addTo(map);
        let marker = L.marker([41.3, -7.74], {icon: motoIcon}).addTo(map);

        // Função para calcular para onde a mota está virada
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const toRad = deg => deg * Math.PI / 180;
            const toDeg = rad => rad * 180 / Math.PI;
            const dLon = toRad(lon2 - lon1);
            lat1 = toRad(lat1); lat2 = toRad(lat2);
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            return (toDeg(Math.atan2(y, x)) + 360) % 360;
        }

        function updateMap() {
            if (currentLat !== null && currentLon !== null) {
                let newLatLng = new L.LatLng(currentLat, currentLon);
                marker.setLatLng(newLatLng);
                
                // Força a câmara do mapa a deslizar durante 1 segundo de forma linear
                map.panTo(newLatLng, {
                    animate: true,
                    duration: 1.0, // Se o teu GPS enviar a cada 0.5s, muda isto para 0.5
                    easeLinearity: 1
                });

                if (lastLat !== null && lastLon !== null && (lastLat !== currentLat || lastLon !== currentLon)) {
                    let angle = calculateBearing(lastLat, lastLon, currentLat, currentLon);
                    
                    // Subtrai 90º para corrigir a orientação da imagem base
                    document.getElementById('moto-marker-icon').style.transform = `rotate(${angle - 90}deg)`;
                }
                
                lastLat = currentLat;
                lastLon = currentLon;
            }
        }

        // ALTERNAR MODOS (LIVE / HISTÓRICO)
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-live').classList.toggle('active', mode === 'live');
            document.getElementById('btn-history').classList.toggle('active', mode === 'history');
            
            const liveCam = document.getElementById('live-cam-stream');            
            const histControls = document.getElementById('history-controls');
            const alertsList = document.getElementById('alerts-list');
            const historyMsg = document.getElementById('history-msg');
            const alertsTitle = document.getElementById('alerts-title');
            const headerStatus = document.querySelector('.header-status'); // Seleciona o cabeçalho

            if (mode === 'history') {
                liveCam.style.display = 'none';
                histControls.style.display = 'flex';
                headerStatus.style.display = 'none'; // Esconde o estado
                alertsList.style.display = 'none';
                historyMsg.style.display = 'block';
                alertsTitle.innerText = "Histórico de Rota";
                
                fetchRoutes();
            } else {
                histControls.style.display = 'none';
                liveCam.style.display = 'flex';
                headerStatus.style.display = 'flex'; // Restaura o estado
                document.getElementById('route-video').pause();
                
                alertsList.style.display = 'block';
                historyMsg.style.display = 'none';
                alertsTitle.innerText = "Eventos Recentes";

                document.getElementById("vel-val").innerText = liveState.vel;
                document.getElementById("bat-val").innerText = liveState.bat;
                document.getElementById("roll-val").innerText = liveState.roll.toFixed(2);
                document.getElementById("bike-img").style.transform = `rotate(${liveState.roll}deg)`;
                
                currentLat = liveState.lat; currentLon = liveState.lon;
                updateMap();
            }
            setTimeout(() => map.invalidateSize(), 100);
        }

        function logEvent(type, message) {
            const list = document.getElementById('alerts-list');
            const time = new Date().toLocaleTimeString();
            let icon, colorClass;

            switch(type) {
                case 'FALL': icon = 'fa-triangle-exclamation'; colorClass = 'alert-danger'; break;
                case 'THEFT': icon = 'fa-shield-halved'; colorClass = 'alert-warning'; break;
                case 'RAIN': icon = 'fa-cloud-rain'; colorClass = 'alert-info'; break;
                default: icon = 'fa-circle-info'; colorClass = 'alert-info';
            }

            const li = document.createElement('li');
            li.className = `alert-item ${colorClass}`;
            li.innerHTML = `<i class="fa-solid ${icon}"></i> 
                            <div><span>${message}</span> <span class="time">${time}</span></div>`;
            
            list.prepend(li);
            if (list.children.length > 30) list.lastChild.remove(); 
        }

        // --- LIGAÇÃO MQTT ---
        const client = new Paho.MQTT.Client(BROKER_IP, PORT, CLIENT_ID);

        client.onConnectionLost = () => {
            const status = document.getElementById("conn-status");
            status.innerText = "Ligação Perdida"; status.style.color = "var(--danger)";
        };

        client.onMessageArrived = (message) => {
            const topic = message.destinationName;
            const payload = message.payloadString;

            try {
                // Guarda sempre em memória (mesmo se estivermos no ecrã de histórico)
                if (topic === "moto/roll") liveState.roll = parseFloat(payload);
                if (topic === "moto/speed") liveState.vel = Math.round(parseFloat(payload));
                if (topic === "moto/battery") liveState.bat = Math.round(parseFloat(payload));
                if (topic === "moto/gps/latitude") liveState.lat = parseFloat(payload);
                if (topic === "moto/gps/longitude") liveState.lon = parseFloat(payload);

                // Só processa alertas MQTT. Os outros dados só mexem a UI se estivermos no modo LIVE.
                if (topic === "moto/alarm") {
                    const alertType = payload.trim().toUpperCase();
                    let msg = "Evento registado.";
                    if (alertType === "FALL") msg = "Queda detetada! Risco de acidente.";
                    if (alertType === "THEFT") msg = "Movimento suspeito! Possível roubo.";
                    if (alertType === "RAIN") msg = "Chuva detetada. Piso escorregadio.";
                    logEvent(alertType, msg);
                }
                
                if (currentMode === 'history') return; // Bloqueia UI updates de live se estiver a ver vídeo

                if (topic === "moto/roll") {
                    document.getElementById("roll-val").innerText = liveState.roll.toFixed(2);
                    document.getElementById("bike-img").style.transform = `rotate(${liveState.roll}deg)`;
                }
                else if (topic === "sim/motorcycle") {
                    const stateBadge = document.getElementById("moto-state");
                    if (payload === "on") {
                        stateBadge.innerText = "ON"; stateBadge.classList.add('on');
                    } else {
                        stateBadge.innerText = "OFF"; stateBadge.classList.remove('on');
                    }
                }
                else if (topic === "moto/speed") document.getElementById("vel-val").innerText = liveState.vel;
                else if (topic === "moto/battery") document.getElementById("bat-val").innerText = liveState.bat;
                else if (topic === "moto/gps/latitude" || topic === "moto/gps/longitude") {
                    currentLat = liveState.lat; currentLon = liveState.lon; updateMap();
                }
            } catch (e) {}
        };

        client.connect({
            onSuccess: () => {
                const status = document.getElementById("conn-status");
                status.innerText = "Online"; status.style.color = "var(--primary)";
                
                client.subscribe("moto/roll");
                client.subscribe("sim/motorcycle");
                client.subscribe("moto/gps/latitude");
                client.subscribe("moto/gps/longitude");
                client.subscribe("moto/speed");
                client.subscribe("moto/battery");
                client.subscribe("moto/alarm");
            },
            onFailure: () => {
                const status = document.getElementById("conn-status");
                status.innerText = "Falha de Rede"; status.style.color = "var(--danger)";
            },
            useSSL: false, timeout: 3
        });

        // --- HISTÓRICO LÓGICA ---
        async function fetchRoutes() {
            try {
                const res = await fetch('./data/index.json');
                const routes = await res.json();
                const select = document.getElementById('route-select');
                select.innerHTML = '<option value="">Selecione uma rota...</option>';
                window.routesCatalog = routes; 
                routes.forEach(r => select.innerHTML += `<option value="${r.id}">${r.name}</option>`);
            } catch (e) {}
        }

        async function loadRoute() {
            const id = document.getElementById('route-select').value;
            if(!id) return;
            const route = window.routesCatalog.find(r => r.id === id);

            // Formata os segundos para MM:SS
            const totalSecs = Math.round(route.duration_sec);
            const mins = Math.floor(totalSecs / 60);
            const secs = (totalSecs % 60).toString().padStart(2, '0');

           document.getElementById('route-stats').innerHTML = 
                `Distância: ${route.distance_km} km | Duração: ${mins}:${secs}`;

                
            const videoElement = document.getElementById('route-video');
            if (route.video_file) {
                videoElement.src = `./videos/${route.video_file.split('/').pop()}`;
                videoElement.style.display = 'block';
            } else {
                videoElement.style.display = 'none';
            }

            const res = await fetch(`./data/${route.data_file}`);
            routeData = await res.json();
        }

        // Sincronizar vídeo com dados
        document.getElementById('route-video').addEventListener('timeupdate', (e) => {
            if(currentMode !== 'history' || routeData.length === 0) return;
            
            const currentTimeMs = Math.floor(e.target.currentTime * 10) * 100;
            const frame = routeData.find(d => d.t >= currentTimeMs);
            
            if(frame) {
                document.getElementById("roll-val").innerText = frame.r.toFixed(2);
                document.getElementById("bike-img").style.transform = `rotate(${frame.r}deg)`;
                
                //Tenta encontrar a velocidade com as chaves mais comuns. 
                let speed = frame.speed || frame.v || frame.s || frame.vel || 0;
                document.getElementById("vel-val").innerText = Math.round(speed);
                
                document.getElementById("bat-val").innerText = frame.bat !== undefined ? Math.round(frame.bat) : "--";

                if(frame.la && frame.lo) {
                    currentLat = frame.la; currentLon = frame.lo;
                    updateMap();
                }
            }
        });
    </script>
</body>
</html>
