version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto
    container_name: Server-Pedro-Mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    image: server-pedro-backend
    container_name: Server-Pedro-Backend
    ports:
      - "50051:50051"
      - "5000:5000"
    depends_on:
      - mosquitto
